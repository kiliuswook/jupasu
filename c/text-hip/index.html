<script>
// 옛 GitHub Pages 링크(kiliuswook.github.io/jupasu/c/{id}/)로 열리면 jupasu.pages.dev 의 같은 페이지로 넘긴다.
if (/\.github\.io$/.test(location.hostname)) {
  location.replace('https://jupasu.pages.dev' + location.pathname.replace(/^\/jupasu(?=\/|$)/, '') + location.search + location.hash);
}

<style>
@font-face { font-family: G; font-weight: 600; src: url(../../assets/assets/fonts/GothicA1-SemiBold.ttf); font-display: swap; }
@font-face { font-family: G; font-weight: 800; src: url(../../assets/assets/fonts/GothicA1-ExtraBold.ttf); font-display: swap; }
@font-face { font-family: M; font-weight: 800; src: url(../../assets/assets/fonts/Montserrat-ExtraBold.ttf); font-display: swap; }
:root { --ink: #14151C; --gen: #34C759; }
* { box-sizing: border-box; margin: 0; }
html { background: var(--ink); }
body { font-family: G, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 600;
       color: #fff; min-height: 100vh; display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 460px; min-height: 100vh; display: flex; flex-direction: column; }
.hero { position: relative; aspect-ratio: 4 / 4.4; background: var(--gen) center 30% / cover no-repeat; }
.hero::after { content: ''; position: absolute; inset: 0;
               background: linear-gradient(to bottom, rgba(20,21,28,.0) 35%, rgba(20,21,28,.75) 75%, var(--ink)); }
.top { position: absolute; z-index: 1; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
       padding: max(16px, env(safe-area-inset-top)) 20px 16px;
       background: linear-gradient(rgba(0,0,0,.45), transparent); }
.top b { font-family: M; font-weight: 800; letter-spacing: .1em; font-size: 17px; }
.body { padding: 0 24px 24px; margin-top: -120px; position: relative; z-index: 1; flex: 1; }
.chip { display: inline-block; background: var(--gen); color: var(--ink); font-weight: 800; font-size: 14px;
        padding: 6px 14px; border-radius: 99px; }
h1 { font-weight: 800; font-size: clamp(34px, 11vw, 52px); line-height: 1.15; margin: 14px 0 10px;
     word-break: keep-all; }
.mean { font-size: 19px; line-height: 1.5; color: #E4E5EA; word-break: keep-all; }
.chat { margin: 22px 0 6px; display: grid; gap: 10px; }
.b { display: flex; gap: 8px; align-items: flex-start; }
.b.me { flex-direction: row-reverse; }
.b i { font-style: normal; font-weight: 800; font-size: 11px; color: var(--ink); border-radius: 99px;
       padding: 4px 8px; flex: none; margin-top: 6px; }
.b span { background: #23252F; border-radius: 16px; padding: 10px 14px; font-size: 15px; line-height: 1.45; max-width: 78%; }
.origin { margin-top: 18px; color: #9A9CA8; font-size: 14px; line-height: 1.55; }
.cta { position: sticky; z-index: 2; bottom: 0; padding: 16px 24px max(20px, env(safe-area-inset-bottom));
       background: linear-gradient(transparent, var(--ink) 28%); }
/* 공식 스토어 배지. 두 배지가 같은 높이로 보이게 Google Play PNG 의 위아래 투명 여백만큼 크게 그리고 여백을 겹친다 */
.stores { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
.stores a { display: block; line-height: 0; }
.stores img { display: block; height: 46px; width: auto; }
.stores .gp img { height: 60px; margin: -7px -2px; }
[hidden] { display: none !important; }
.bars { display: flex; height: 6px; } .bars i { flex: 1; }
</style>

<body>
<main>
  <div class="hero" style="background-image: url('../../assets/assets/images/text-hip.jpg')">
    <div class="top">
      <svg viewBox="0 0 740 580" width="30" height="24" aria-hidden="true"><rect x="0" y="190" width="100" height="200" rx="50" fill="#FF3B8D"/><rect x="160" y="100" width="100" height="380" rx="50" fill="#34C759"/><rect x="320" y="0" width="100" height="580" rx="50" fill="#6366F1"/><rect x="480" y="100" width="100" height="380" rx="50" fill="#FFD93D"/><rect x="640" y="190" width="100" height="200" rx="50" fill="#FF8A3D"/></svg>
      <b>JUPASU</b>
    </div>
  </div>
  <div class="body">
    <span class="chip">20대의 말</span>
    <h1>텍스트힙</h1>
    <p class="mean">책 읽기와 필사를 멋으로 여기는 유행.</p>
    <div class="chat"><div class="b"><i style="background:#34C759">20대</i><span>요즘 필사하는 게 텍스트힙이래.</span></div><div class="b me"><i style="background:#FF8A3D">50대+</i><span>우린 문학소녀라고 불렀지.</span></div></div>
    <p class="origin">텍스트(text)와 힙(hip)을 합친 말로 2024년경 등장했다.</p>
  </div>
  <div class="cta">
    <div class="stores">
      <a class="gp" id="play" href="https://play.google.com/store/apps/details?id=app.jupasu"><img src="../../badges/google-play-ko.png" alt="Google Play에서 다운로드"></a>
      
    </div>
  </div>
  <div class="bars"><i style="background:#FF3B8D"></i><i style="background:#34C759"></i><i style="background:#6366F1"></i><i style="background:#FFD93D"></i><i style="background:#FF8A3D"></i></div>
</main>
<script>
// Android: Google Play 배지를 누르면 앱이 있으면 이 카드로 열고, 없으면 Play 스토어로 간다.
if (/Android/i.test(navigator.userAgent)) {
  document.getElementById('play').href = 'intent://open?card=text-hip#Intent;scheme=jupasu;package=app.jupasu;' +
    'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=app.jupasu') + ';end';
}
</script>
</body>
</html>
