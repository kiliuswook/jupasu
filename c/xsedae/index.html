<script>
(function () {
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var $ = function (id) { return document.getElementById(id); };
  if (android) {
    // 앱이 있으면 그 카드로 열고, 없으면 Play 스토어로 간다.
    var open = $('open');
    open.href = 'intent://open?card=xsedae#Intent;scheme=jupasu;package=app.jupasu;' +
      'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=app.jupasu') + ';end';

})();
