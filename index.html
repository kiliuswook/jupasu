<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!--
    같은 빌드가 두 곳에 올라간다: Cloudflare Pages(jupasu.pages.dev, 사이트 루트)와
    GitHub Pages(kiliuswook.github.io/jupasu/). 그래서 <base> 를 빌드 때 박지 않고 여기서 정한다
    (빌드는 --base-href 없이). GitHub Pages 에서 열리면 같은 경로·쿼리(?card= ?room= ?s=)의
    jupasu.pages.dev 주소로 바로 넘긴다. 공유 미리보기는 크롤러가 JS 를 돌리지 않아 그대로 나온다.
  -->
  <script>
    (function () {
      var l = location, gh = /\.github\.io$/.test(l.hostname);
      if (gh) {
        l.replace('https://jupasu.pages.dev' + (l.pathname.replace(/^\/jupasu(?=\/|$)/, '') || '/') + l.search + l.hash);
      }
      document.write('<base href="' + (gh ? '/jupasu/' : '/') + '">');
    })();
  </script>

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="주파수 JUPASU · 세대의 말을 서로 배우는 곳">
  <meta name="theme-color" content="#000000">

  <!-- 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="주파수 JUPASU">
  <meta property="og:url" content="https://jupasu.pages.dev/">
  <meta property="og:title" content="주파수 JUPASU">
  <meta property="og:description" content="세대의 말을 서로 배우는 곳. 10대부터 50대까지, 서로의 말 알아듣기 테스트와 친구 대결">
  <!-- og/default.jpg 는 tools/share_pages.py 가 만든다 -->
  <meta property="og:image" content="https://jupasu.pages.dev/og/default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="주파수">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>주파수 JUPASU</title>
  <link rel="manifest" href="manifest.json">

  <!--
    웹 공유(lib/web_share_web.dart 가 부른다).
    - shareText: 글(점수·웹 링크·구글 플레이·앱스토어)만으로 공유 창을 연다. 링크 미리보기가 카드 그림(og)을 보여 준다.
      이미지 파일을 함께 넣으면 PC(Windows) 공유 창의 카카오톡·디스코드·복사가 글을 버리거나 아예 받지 못해서
      (2026-11-18 원더 님 확인) 이미지는 "이미지 저장"(download)으로 따로 둔다.
      누른 순간에 글을 클립보드에도 복사해 두고, 공유 창이 없는 브라우저는 'none' 을 돌려준다.
    - kakao*: 카카오 JavaScript SDK(카카오톡 공유). PC 는 카카오 공유 팝업(카카오 웹 로그인 필요), 휴대폰은 카카오톡 앱.
      메시지 버튼은 "구글 플레이"·"앱스토어". 앱 키는 lib/share.dart KakaoShare.javaScriptAppKey 와 같다
      (카카오 개발자 앱 "주파수", 웹 도메인 jupasu.pages.dev).
  -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous" async></script>
  <script>
    window.jupasuShare = {
      copy: function (text) {
        try {
          if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).catch(function () {}); return true; }
        } catch (e) {}
        try {
          var t = document.createElement('textarea');
          t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
          document.body.appendChild(t); t.select();
          var ok = document.execCommand('copy'); t.remove(); return ok;
        } catch (e) { return false; }
      },
      // 결과: 'shared'(이미지+글) · 'text'(글만) · 'cancel' · 'none'(공유 창 없음) · 'error'
      share: function (bytes, name, text) {
        var file = new File([bytes], name, { type: 'image/png' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            return navigator.share({ files: [file], text: text }).then(function () { return 'shared'; }, window.jupasuShare._err);
          }
          if (navigator.share) {
            return navigator.share({ text: text }).then(function () { return 'text'; }, window.jupasuShare._err);
          }
        } catch (e) { return Promise.resolve('error'); }
        return Promise.resolve('none');
      },
      shareText: function (text) {
        if (!navigator.share) return Promise.resolve('none');
        try { return navigator.share({ text: text }).then(function () { return 'text'; }, window.jupasuShare._err); }
        catch (e) { return Promise.resolve('error'); }
      },
      _err: function (e) { return e && e.name === 'AbortError' ? 'cancel' : 'error'; },
      download: function (bytes, name) {
        var url = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
        var a = document.createElement('a');
        a.href = url; a.download = name; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      },
      kakaoKey: '04a92e7040b68863dcd6a8abdc89dc31',
      mobile: function () {
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
      },
      kakaoReady: function () {
        // Kakao.Share 는 init 뒤에야 생긴다
        var K = window.Kakao;
        if (!K || !K.init) return false;
        try { if (!K.isInitialized()) K.init(window.jupasuShare.kakaoKey); } catch (e) { return false; }
        return !!K.Share;
      },
      // 카드 이미지를 카카오에 올린다. 결과는 JSON 문자열 {url,w,h}, 실패하면 ''.
      kakaoUpload: function (bytes) {
        if (!window.jupasuShare.kakaoReady()) return Promise.resolve('');
        try {
          var dt = new DataTransfer();
          dt.items.add(new File([bytes], 'jupasu.png', { type: 'image/png' }));
          return window.Kakao.Share.uploadImage({ file: dt.files }).then(function (r) {
            var o = r.infos.original;
            return JSON.stringify({ url: o.url, w: o.width, h: o.height });
          }, function (e) { console.warn('kakaoUpload', e); return ''; });
        } catch (e) { console.warn('kakaoUpload', e); return Promise.resolve(''); }
      },
      // 피드 메시지를 보낸다. o: {title, desc, img, w, h, link, params, get(앱 받기 주소)}. 누른 순간에 불러야 PC 팝업이 막히지 않는다.
      kakaoSend: function (json) {
        if (!window.jupasuShare.kakaoReady()) return false;
        var o = JSON.parse(json);
        var link = { webUrl: o.link, mobileWebUrl: o.link };
        if (o.params) { link.androidExecutionParams = o.params; link.iosExecutionParams = o.params; }
        var content = { title: o.title, description: o.desc, imageUrl: o.img, link: link };
        if (o.w && o.h) { content.imageWidth = o.w; content.imageHeight = o.h; }
        try {
          // 버튼은 두 개까지: 구글 플레이 · 앱스토어. 카카오 메시지에는 등록한 도메인 주소만 넣을 수 있어서
          // get/?to=play|ios 를 거쳐 스토어로 간다. 메시지(카드)를 누르면 웹 링크(앱이 있으면 앱)로 간다.
          var buttons = [{ title: '앱에서 보기', link: link }];
          if (o.get) buttons = [
            { title: '구글 플레이', link: { webUrl: o.get + '?to=play', mobileWebUrl: o.get + '?to=play' } },
            { title: '앱스토어', link: { webUrl: o.get + '?to=ios', mobileWebUrl: o.get + '?to=ios' } }
          ];
          window.Kakao.Share.sendDefault({ objectType: 'feed', content: content, buttons: buttons });
          return true;
        } catch (e) { console.warn('kakaoSend', e); return false; }
      }
    };
  </script>

  <!-- 실행 화면: Flutter 가 첫 화면을 그리면 걷어 낸다 -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              transition: opacity .3s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo { width: 96px; height: auto; }
    .splash-logo rect { animation: eq 1.2s ease-in-out infinite; }
    .splash-logo rect:nth-child(2) { animation-delay: .15s; }
    .splash-logo rect:nth-child(3) { animation-delay: .3s; }
    .splash-logo rect:nth-child(4) { animation-delay: .45s; }
    .splash-logo rect:nth-child(5) { animation-delay: .6s; }
    @keyframes eq { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .splash-logo rect { animation: none; } }
    #opened { position: fixed; left: 0; right: 0; bottom: 18%; text-align: center; color: #fff;
              font: 600 16px -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    #opened[hidden] { display: none; }
    #opened a { display: inline-block; margin-top: 10px; color: #14151C; background: #fff; border-radius: 99px;
                padding: 12px 22px; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="주파수"><svg xmlns="http://www.w3.org/2000/svg" class="splash-logo" viewBox="0 0 740 580"><rect x="0.000" y="190.000" width="100.000" height="200.000" rx="50.000" fill="#FF3B8D"/><rect x="160.000" y="100.000" width="100.000" height="380.000" rx="50.000" fill="#34C759"/><rect x="320.000" y="0.000" width="100.000" height="580.000" rx="50.000" fill="#6366F1"/><rect x="480.000" y="100.000" width="100.000" height="380.000" rx="50.000" fill="#FFD93D"/><rect x="640.000" y="190.000" width="100.000" height="200.000" rx="50.000" fill="#FF8A3D"/></svg></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    대결 초대 링크(?room=코드)를 Android 휴대폰 브라우저에서 열면 앱을 먼저 찾는다
    (intent://open?room=코드 → MainActivity.kt → lib/share.dart 의 AppLink → 그 방 대결 화면).
    앱이 없으면 브라우저가 같은 주소에 web=1 을 붙여 다시 열고, 그때는 웹 앱으로 그 방에 들어간다.
    앱이 열리면 이 탭은 웹 앱을 띄우지 않는다(같은 사람이 웹으로 한 번 더 들어가지 않게).
    앱 열기가 막힌 브라우저(일부 인앱 브라우저)는 1.5초 뒤 웹으로 계속한다.
  -->
  <div id="opened" hidden>
    <p>주파수 앱에서 대결방을 열었어요.</p>
    <a href="#">웹에서 계속하기</a>
  </div>
  <script>
    (function () {
      var booted = false, opened = false;
      function boot() {
        if (booted) return;
        booted = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      var q = new URLSearchParams(location.search), room = q.get('room');
      if (!room || q.has('web') || !/Android/i.test(navigator.userAgent) || /\.github\.io$/.test(location.hostname)) {
        return boot();
      }
      q.set('web', '1');
      var back = location.origin + location.pathname + '?' + q.toString() + location.hash;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { opened = true; return; }
        if (!opened || booted) return;
        // 앱에서 돌아왔을 때: 웹으로 이어 갈지 고르게 한다
        var n = document.getElementById('opened');
        n.querySelector('a').href = back;
        n.hidden = false;
      });
      setTimeout(function () { if (!opened && !document.hidden) boot(); }, 1500);
      location.href = 'intent://open?room=' + encodeURIComponent(room) + '#Intent;scheme=jupasu;package=app.jupasu;' +
        'S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
    })();
  </script>
</body>
</html>
