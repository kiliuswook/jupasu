<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!--
    같은 빌드가 두 곳에 올라간다: Cloudflare Pages(jupasu.pages.dev, 사이트 루트)와
    GitHub Pages(kiliuswook.github.io/jupasu/). 그래서 <base> 를 빌드 때 박지 않고 여기서 정한다
    (빌드는 --base-href 없이). GitHub Pages 에서 열리면 같은 경로·쿼리(?card= ?room= ?s=)의
    jupasu.pages.dev 주소로 바로 넘긴다. 공유 미리보기는 크롤러가 JS 를 돌리지 않아 그대로 나온다.
  -->
  <script>
    (function () {
      var l = location, gh = /\.github\.io$/.test(l.hostname);
      if (gh) {
        l.replace('https://jupasu.pages.dev' + (l.pathname.replace(/^\/jupasu(?=\/|$)/, '') || '/') + l.search + l.hash);
      }
      document.write('<base href="' + (gh ? '/jupasu/' : '/') + '">');
    })();
  </script>

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="주파수 JUPASU · 세대의 말을 서로 배우는 곳">
  <meta name="theme-color" content="#000000">

  <!-- 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="주파수 JUPASU">
  <meta property="og:url" content="https://jupasu.pages.dev/">
  <meta property="og:title" content="주파수 JUPASU">
  <meta property="og:description" content="세대의 말을 서로 배우는 곳. 10대부터 50대까지, 서로의 말 알아듣기 테스트와 친구 대결">
  <!-- og/default.jpg 는 tools/share_pages.py 가 만든다 -->
  <meta property="og:image" content="https://jupasu.pages.dev/og/default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="주파수">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>주파수 JUPASU</title>
  <link rel="manifest" href="manifest.json">

  <!-- 실행 화면: Flutter 가 첫 화면을 그리면 걷어 낸다 -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              transition: opacity .3s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo { width: 96px; height: auto; }
    .splash-logo rect { animation: eq 1.2s ease-in-out infinite; }
    .splash-logo rect:nth-child(2) { animation-delay: .15s; }
    .splash-logo rect:nth-child(3) { animation-delay: .3s; }
    .splash-logo rect:nth-child(4) { animation-delay: .45s; }
    .splash-logo rect:nth-child(5) { animation-delay: .6s; }
    @keyframes eq { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .splash-logo rect { animation: none; } }
    #opened { position: fixed; left: 0; right: 0; bottom: 18%; text-align: center; color: #fff;
              font: 600 16px -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    #opened[hidden] { display: none; }
    #opened a { display: inline-block; margin-top: 10px; color: #14151C; background: #fff; border-radius: 99px;
                padding: 12px 22px; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="주파수"><svg xmlns="http://www.w3.org/2000/svg" class="splash-logo" viewBox="0 0 740 580"><rect x="0.000" y="190.000" width="100.000" height="200.000" rx="50.000" fill="#FF3B8D"/><rect x="160.000" y="100.000" width="100.000" height="380.000" rx="50.000" fill="#34C759"/><rect x="320.000" y="0.000" width="100.000" height="580.000" rx="50.000" fill="#6366F1"/><rect x="480.000" y="100.000" width="100.000" height="380.000" rx="50.000" fill="#FFD93D"/><rect x="640.000" y="190.000" width="100.000" height="200.000" rx="50.000" fill="#FF8A3D"/></svg></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    대결 초대 링크(?room=코드)를 Android 휴대폰 브라우저에서 열면 앱을 먼저 찾는다
    (intent://open?room=코드 → MainActivity.kt → lib/share.dart 의 AppLink → 그 방 대결 화면).
    앱이 없으면 브라우저가 같은 주소에 web=1 을 붙여 다시 열고, 그때는 웹 앱으로 그 방에 들어간다.
    앱이 열리면 이 탭은 웹 앱을 띄우지 않는다(같은 사람이 웹으로 한 번 더 들어가지 않게).
    앱 열기가 막힌 브라우저(일부 인앱 브라우저)는 1.5초 뒤 웹으로 계속한다.
  -->
  <div id="opened" hidden>
    <p>주파수 앱에서 대결방을 열었어요.</p>
    <a href="#">웹에서 계속하기</a>
  </div>
  <script>
    (function () {
      var booted = false, opened = false;
      function boot() {
        if (booted) return;
        booted = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      var q = new URLSearchParams(location.search), room = q.get('room');
      if (!room || q.has('web') || !/Android/i.test(navigator.userAgent) || /\.github\.io$/.test(location.hostname)) {
        return boot();
      }
      q.set('web', '1');
      var back = location.origin + location.pathname + '?' + q.toString() + location.hash;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { opened = true; return; }
        if (!opened || booted) return;
        // 앱에서 돌아왔을 때: 웹으로 이어 갈지 고르게 한다
        var n = document.getElementById('opened');
        n.querySelector('a').href = back;
        n.hidden = false;
      });
      setTimeout(function () { if (!opened && !document.hidden) boot(); }, 1500);
      location.href = 'intent://open?room=' + encodeURIComponent(room) + '#Intent;scheme=jupasu;package=app.jupasu;' +
        'S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
    })();
  </script>
</body>
</html>
